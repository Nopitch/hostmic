[package]
name = "hostmic-abi"
version = "0.1.0"
description = "The hostmic host interface: device interface GUID, I/O control codes and request layouts"
# Shared by the driver (MS-PL) and the host library (MIT OR Apache-2.0): the more permissive
# licence, so that any host may use it.
license = "MIT OR Apache-2.0"
edition.workspace = true
publish.workspace = true
repository.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
