[package]
name = "hostmic-handle-check"
version = "0.1.0"
description = "Checks the hostmic driver's handle rules: the host's mapping lasts while the host lives, and never outlives it"
license = "MIT OR Apache-2.0"
edition.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "handle-check"
path = "src/main.rs"

[dependencies]
hostmic-abi = { path = "../../abi" }
windows = { version = "0.62.2", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ProcessSnapshotting",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
multiple_unsafe_ops_per_block = "forbid"
undocumented_unsafe_blocks = "forbid"
