[package]
name = "hostmic-test-host"
version = "0.1.0"
description = "A test host for the hostmic driver: plays a tone through the hostmic crate's reference loop"
license = "MIT OR Apache-2.0"
edition.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "test-host"
path = "src/main.rs"

[dependencies]
hostmic = { path = "../../host" }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
