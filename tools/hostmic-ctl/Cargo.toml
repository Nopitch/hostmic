[package]
name = "hostmic-ctl"
version = "0.1.0"
description = "Inspects the hostmic driver through its host interface: what it offers, the stream and the counters"
license = "MIT OR Apache-2.0"
edition.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "hostmic-ctl"
path = "src/main.rs"

[dependencies]
hostmic = { path = "../../host" }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
