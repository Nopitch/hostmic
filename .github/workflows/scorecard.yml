name: scorecard

# OpenSSF Scorecard: an automated health check of the project's security practices
# (branch protection, pinned dependencies, token permissions…). Results appear in the
# Security tab and on https://scorecard.dev.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  # Re-run when branch protection changes.
  branch_protection_rule:
  workflow_dispatch:

# Nothing by default; the job asks for exactly what it needs.
permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Read workflow runs (Scorecard's CI-tests and dangerous-workflow checks).
      actions: read
      # Upload the results to code scanning.
      security-events: write
      # Publish the results (OIDC token), required by `publish_results: true`.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
