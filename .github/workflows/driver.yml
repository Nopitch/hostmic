name: driver

# Builds, lints and packages the kernel driver on a GitHub-hosted Windows runner. Loading it
# is only ever done in the maintainer's test VM (see PLAN.md, "Development environment").
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: driver-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Public repository: GitHub-hosted runners only, never self-hosted.
  # A required check of the `Protect main` ruleset: named after what it checks, so that another
  # workflow's `build` job can never satisfy it.
  driver:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      # The WDK comes from NuGet, as in windows-drivers-rs' own CI, rather than from whatever
      # the runner image ships: the image's WDK changes without notice. Same SDK base version
      # (10.0.26100) as the maintainer's machine.
      WDK_NUGET_VERSION: "10.0.26100.6584"
      CARGO_WDK_VERSION: "0.2.0"
      CARGO_TERM_COLOR: always
      # No incremental compilation in CI: it is not reused across runs and would bloat the cache.
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the token out of .git/config (zizmor's artipacked rule).
          persist-credentials: false

      # Caches (PLAN.md, CI): restored by every run, written only by pushes to main, so a pull
      # request can never write what another run restores (a pull request's own cache scope is
      # never read outside it). Exact keys: the WDK version, cargo-wdk's version, the toolchain,
      # LLVM and Cargo.lock. Never used by a release workflow.
      - name: Restore the WDK
        id: wdk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\packages
          key: wdk-nuget-${{ runner.os }}-${{ env.WDK_NUGET_VERSION }}

      - name: Install the WDK from NuGet
        shell: pwsh
        env:
          CACHE_HIT: ${{ steps.wdk-cache.outputs.cache-hit }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $root = 'C:\packages'
          if ($env:CACHE_HIT -ne 'true') {
            nuget install Microsoft.Windows.WDK.x64 -Version $env:WDK_NUGET_VERSION -OutputDirectory $root -NonInteractive
            if ($LASTEXITCODE -ne 0) { throw "nuget install failed ($LASTEXITCODE)" }
          }

          # The packages, downloaded or restored, must be exactly these: SHA-512 as nuget.org
          # publishes it (catalog entry, packageHash). Update them with WDK_NUGET_VERSION.
          $expected = @{
            'Microsoft.Windows.WDK.x64.10.0.26100.6584.nupkg' = 'jhddaBnhMDqt3GVr32RVTtaR0KHmZDjY0JCTMn10OQpk4+AShXCK9QA09vBazp8ni1Mju84qM5SGXfIfnyOJ+g=='
            'Microsoft.Windows.SDK.CPP.10.0.26100.1.nupkg' = 'ZveRWpfQKpduSRyI9WxRFQ5BpU9XZ+K2BGQ6lZup//PiH+KPFIGFd/QqrvFjh+isrlOOiJ5cNF6IKuZDCh1E7w=='
            'Microsoft.Windows.SDK.CPP.x64.10.0.26100.1.nupkg' = 'EhG+TCUZWAQr2U8CyFBPhIZedtUphVxpRl6fKOSOQvEQYelZ1FslrkmAbNBHqbp80eUOTb1Z7VkIEU/56c2Pdw=='
          }
          $found = @(Get-ChildItem $root -Recurse -Filter *.nupkg)
          if ($found.Count -ne $expected.Count) {
            $found | ForEach-Object Name
            throw "Expected $($expected.Count) packages, found $($found.Count)"
          }
          foreach ($package in $found) {
            if (-not $expected.ContainsKey($package.Name)) { throw "Unexpected package $($package.Name)" }
            $sha = [System.Security.Cryptography.SHA512]::Create()
            $stream = [System.IO.File]::OpenRead($package.FullName)
            try { $hash = [Convert]::ToBase64String($sha.ComputeHash($stream)) } finally { $stream.Dispose() }
            if ($hash -cne $expected[$package.Name]) { throw "SHA-512 mismatch for $($package.Name): $hash" }
            Write-Host "verified $($package.Name)"
          }

          # Same layout and variables as windows-drivers-rs' install-wdk action; wdk-build
          # reads them instead of looking for an installed WDK.
          $sdkVersion = ($env:WDK_NUGET_VERSION.Split('.')[0..2]) -join '.'
          $wdk = @(Get-ChildItem $root -Directory | Where-Object Name -match "^Microsoft\.Windows\.WDK\.x64\.$([regex]::Escape($sdkVersion))\.\d+$")
          $sdk = @(Get-ChildItem $root -Directory | Where-Object Name -match "^Microsoft\.Windows\.SDK\.CPP\.$([regex]::Escape($sdkVersion))\.\d+$")
          if ($wdk.Count -ne 1 -or $sdk.Count -ne 1) {
            Get-ChildItem $root -Directory | ForEach-Object Name
            throw "Expected exactly one WDK x64 and one SDK CPP package, found $($wdk.Count) and $($sdk.Count)"
          }
          $vars = [ordered]@{
            Version_Number     = "$sdkVersion.0"
            WindowsSdkBinPath  = "$($sdk[0].FullName)\c\bin"
            WDKContentRoot     = "$($wdk[0].FullName)\c\"
            WDKBinRoot         = "$($wdk[0].FullName)\c\bin\$sdkVersion.0"
            WDKToolRoot        = "$($wdk[0].FullName)\c\tools\$sdkVersion.0"
          }
          foreach ($name in $vars.Keys) {
            $value = $vars[$name]
            if ($name -ne 'Version_Number' -and -not (Test-Path $value)) { throw "Missing $name = $value" }
            Write-Host "$name=$value"
            "$name=$value" >> $env:GITHUB_ENV
          }

      - name: Point bindgen at the runner's LLVM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llvm = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path "$llvm\libclang.dll")) { throw "libclang.dll not found in $llvm" }
          $version = (& "$llvm\clang.exe" --version | Select-Object -First 1)
          Write-Host $version
          if ($version -notmatch 'clang version (\d+\.\d+\.\d+)') { throw "Unexpected clang version: $version" }
          "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV
          # Part of the build cache's key: bindgen's output depends on libclang.
          "LLVM_VERSION=$($Matches[1])" >> $env:GITHUB_ENV

      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      # Cargo's downloaded crates and the compiled dependencies (workspace crates are removed
      # before saving, so the cache never holds this repository's own build). A partial match
      # (an older Cargo.lock, same toolchain, WDK and LLVM) still saves most of the build.
      - name: Restore the Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-wdk-${{ env.WDK_NUGET_VERSION }}-llvm-${{ env.LLVM_VERSION }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-wdk-${{ env.WDK_NUGET_VERSION }}-llvm-${{ env.LLVM_VERSION }}-

      # cargo-wdk creates its throwaway test certificate in the runner's certificate store only
      # when `target/<profile>/WDRLocalTestCert.cer` is missing: a certificate file restored
      # from the cache, without the store that went with it, makes signing fail. The cache must
      # never carry it (removed before saving too).
      - name: Remove a cached test certificate
        shell: pwsh
        run: Remove-Item -Force target\*\WDRLocalTestCert.cer -ErrorAction SilentlyContinue

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      # hostmic-sys: Rust layouts and GUIDs checked against what MSVC computes from the WDK
      # headers. hostmic-abi: request layouts match their byte encodings. hostmic-driver-core:
      # the driver's pure logic (clock, packets, buffer geometry, host request validation).
      - name: Test
        run: cargo test --locked

      # cargo-wdk publishes no prebuilt binary: built once per version and toolchain.
      - name: Restore cargo-wdk
        id: cargo-wdk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-wdk.exe
          key: cargo-wdk-${{ runner.os }}-${{ env.CARGO_WDK_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Install cargo-wdk
        if: steps.cargo-wdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: cargo install cargo-wdk --version $env:CARGO_WDK_VERSION --locked

      - name: Check cargo-wdk
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = cargo wdk --version
          Write-Host $version
          if ($version -notmatch [regex]::Escape($env:CARGO_WDK_VERSION)) { throw "Expected cargo-wdk $env:CARGO_WDK_VERSION, got: $version" }

      # Build, stampinf, inf2cat, infverif and test signing with a throwaway certificate. The
      # debug build (overflow checks, debug assertions) is the one tested in the VM; the release
      # build is what a release ships, as other driver projects build both.
      - name: Build and package the driver (debug)
        run: cargo wdk build --locked

      - name: Build and package the driver (release)
        run: cargo wdk build --locked --profile release

      # cargo-wdk runs InfVerif in universal mode (/u). Also check the stamped INFs as the
      # Hardware Dev Center does (/h: WHQL signature requirements) and for driver isolation (/w).
      - name: Check the INF for submission and driver isolation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $infverif = Join-Path $env:WDKToolRoot 'x64\infverif.exe'
          if (-not (Test-Path $infverif)) { throw "infverif.exe not found at $infverif" }
          foreach ($buildProfile in 'debug', 'release') {
            $inf = "target\$buildProfile\hostmic_driver_package\hostmic_driver.inf"
            foreach ($mode in '/h', '/w') {
              & $infverif /v $mode $inf
              if ($LASTEXITCODE -ne 0) { throw "infverif $mode failed on the $buildProfile INF ($LASTEXITCODE)" }
            }
          }

      # The test-signed packages, for the VM tests (docs/test-vm.md) without a local build. A
      # pull request's artifact is for looking at only: nothing privileged ever consumes it.
      - name: Upload the driver packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hostmic-driver-${{ github.sha }}
          path: |
            target/debug/hostmic_driver_package/
            target/release/hostmic_driver_package/
          if-no-files-found: error
          retention-days: 14

      # Saved by pushes to main only, and only what was not restored exactly.
      - name: Save the WDK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.wdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\packages
          key: wdk-nuget-${{ runner.os }}-${{ env.WDK_NUGET_VERSION }}

      - name: Save cargo-wdk
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-wdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-wdk.exe
          key: cargo-wdk-${{ runner.os }}-${{ env.CARGO_WDK_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Remove the workspace crates' build from the Cargo cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = (cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json).packages.name
          foreach ($package in $packages) {
            cargo clean --package $package --locked
            if ($LASTEXITCODE -ne 0) { throw "cargo clean -p $package failed" }
          }
          Remove-Item -Recurse -Force target\debug\hostmic_driver_package, target\release\hostmic_driver_package -ErrorAction SilentlyContinue
          Remove-Item -Force target\*\WDRLocalTestCert.cer -ErrorAction SilentlyContinue

      - name: Save the Cargo cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-wdk-${{ env.WDK_NUGET_VERSION }}-llvm-${{ env.LLVM_VERSION }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}
