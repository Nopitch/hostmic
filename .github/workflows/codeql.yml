name: codeql

# Static analysis (SAST) of the Rust code and of the GitHub Actions workflows. PLAN.md requires
# CodeQL before any signing request; running it on every pull request also feeds Scorecard's
# SAST check.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

# Nothing by default; the job asks for exactly what it needs.
permissions: {}

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Public repository: GitHub-hosted runners only, never self-hosted.
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Upload the results to code scanning.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # No build: CodeQL extracts Rust from the sources (the driver itself only builds on
        # Windows with the WDK, which the `driver` workflow covers).
        language: [actions, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the token out of .git/config (zizmor's artipacked rule).
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
