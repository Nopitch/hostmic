version: 2
# Version updates wait 7 days after a release (`cooldown`): a compromised or broken release is
# usually reported and pulled within days, before Dependabot proposes it. Security updates
# are not delayed (GitHub does not apply cooldown to them).
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # windows-drivers-rs crates are released together and must move together.
      windows-drivers-rs:
        patterns:
          - "wdk"
          - "wdk-*"

  # The fuzz targets are a Cargo workspace of their own.
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
