version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # windows-drivers-rs crates are released together and must move together.
      windows-drivers-rs:
        patterns:
          - "wdk"
          - "wdk-*"
