name: Bug report
description: Something does not work as expected (not a security issue).
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities must be reported privately: see SECURITY.md.
        Only the first fields are required; the others make most problems diagnosable without
        a round trip. The driver must only run in a virtual machine (docs/test-vm.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 (26100.xxxx), in a Hyper-V VM
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: hostmic commit or version
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host application
      description: What fed the microphone (tools/test-host, another application), and its version.
      placeholder: tools/test-host at the same commit
  - type: textarea
    id: status
    attributes:
      label: Output of hostmic-ctl status
      description: >
        Run `hostmic-ctl status` while the problem shows (stream state, generation, counters,
        last refused request and its reason).
      render: text
  - type: textarea
    id: capture
    attributes:
      label: Output of capture-check, or of the host
      description: >
        For audio problems: the whole output of `capture-check` (its `engine:` line gives the
        reason for a FAIL), and the host's own output (test-host's `playing` and `late` lines).
      render: text
  - type: textarea
    id: crash
    attributes:
      label: Crash (blue screen)
      description: >
        The bug check code and its four parameters, or the output of `!analyze -v` on the dump.
        In a Hyper-V VM the host logs them: Hyper-V-Worker-Admin, event 18590.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Driver messages, other logs, steps to reproduce
      description: The driver's `hostmic:` lines from DebugView (docs/test-vm.md, section 5), and anything else.
      render: text
