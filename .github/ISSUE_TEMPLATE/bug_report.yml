name: Bug report
description: Something does not work as expected (not a security issue).
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities must be reported privately: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 (26100.xxxx), in a Hyper-V VM
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: hostmic commit or version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, crash dump analysis, steps to reproduce
      render: text
