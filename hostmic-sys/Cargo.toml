[package]
name = "hostmic-sys"
version = "0.1.0"
description = "Raw FFI bindings to the PortCls and Kernel Streaming headers used by the hostmic driver"
license = "MIT OR Apache-2.0"
edition.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
wdk-sys.workspace = true

[dev-dependencies]
# Lets the test binary link without the kernel: stubs for `DriverEntry` and the WDF symbols.
wdk-sys = { workspace = true, features = ["test-stubs"] }

[build-dependencies]
bindgen.workspace = true
cc.workspace = true
wdk-build.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# `deny`, not `forbid` as in the driver: the bindgen output (and only it) is exempted.
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"
