[package]
name = "hostmic-driver"
version = "0.1.0"
description = "hostmic kernel driver: a PortCls audio adapter exposing one capture endpoint"
license = "MS-PL"
edition.workspace = true
publish.workspace = true
repository.workspace = true

# Uses the workspace's WDK configuration.
[package.metadata.wdk]

[lib]
crate-type = ["cdylib"]
# No host unit tests: everything here calls the kernel or PortCls. The driver is tested by
# loading it in the test VM; logic that needs no kernel call belongs in a crate of its own.
test = false

[dependencies]
hostmic-abi = { path = "../abi" }
hostmic-driver-core = { path = "../driver-core" }
hostmic-sys = { path = "../hostmic-sys" }
wdk.workspace = true
wdk-alloc.workspace = true
wdk-panic.workspace = true
wdk-sys.workspace = true

[build-dependencies]
wdk-build.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Every unsafe operation gets its own block and its own SAFETY comment.
multiple_unsafe_ops_per_block = "forbid"
undocumented_unsafe_blocks = "forbid"
