[workspace]
members = [
    "abi",
    "host",
    "driver",
    "driver-core",
    "hostmic-sys",
    "tools/capture-check",
    "tools/handle-check",
    "tools/ioctl-fuzz",
    "tools/hostmic-ctl",
    "tools/measure",
    "tools/test-host",
]
resolver = "3"
# Fuzz targets: a workspace of their own, built with nightly by cargo-fuzz.
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
publish = false
repository = "https://github.com/Nopitch/hostmic"

# windows-drivers-rs supports one WDK configuration per workspace. The driver is a plain WDM
# PortCls adapter: Microsoft's audio sample uses KMDF only for a framework device that serves
# Bluetooth bypass, which hostmic does not have (PLAN.md, M3).
[workspace.metadata.wdk.driver-model]
driver-type = "WDM"

# Kernel code cannot unwind.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
# As in debug builds: an arithmetic overflow panics instead of wrapping. The code saturates or
# checks wherever a value can overflow; should one ever wrap anyway, the release driver stops
# with a bug check that names the place (`wdk-panic`: code "RPNC", the file and line in its
# parameters) rather than going on with a wrong size or position, which in the kernel can
# corrupt memory. Hosts and tools built in release abort the same way (PLAN.md, M6).
overflow-checks = true

[workspace.dependencies]
# Same bindgen as wdk-build's `BuilderExt`, which is implemented for this version's `Builder`.
bindgen = "0.73.2"
cc = "1.11.1"
wdk = "0.5.0"
wdk-alloc = "0.4.2"
wdk-build = "0.6.0"
wdk-panic = "0.5.0"
wdk-sys = "0.5.2"
